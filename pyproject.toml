[project]
name = "hf-workbench"
version = "0.1.0"
description = "Heurist Finance - thesis-driven finance workbench prototype"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "bedrock-agentcore",
    "boto3>=1.35.0",
    "claude-agent-sdk>=0.1.66",
    "curl-cffi>=0.7.0",
    "exa-py>=2.12.1",
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "firecrawl-py>=4.23.0",
    "google-genai",
    "googlenewsdecoder>=0.1.7",
    "httpx>=0.27.0",
    "langfuse>=3.0.0",
    "matplotlib>=3.9.0",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "strands-agents>=1.0.0",
    "strands-agents-tools[agent_core_code_interpreter]>=0.2.0",
    "trafilatura>=1.12.0",
    "uvicorn>=0.32.0",
]

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
