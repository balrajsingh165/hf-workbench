name: story-gold

on:
  pull_request:
    paths:
      - "src/news/firehose_gate.py"
      - "src/news/cluster.py"
      - "src/news/persist.py"
      - "src/news/routing.py"
      - "src/news/synthesis.py"
      - "src/news/verifier.py"
      - "src/news/taxonomies.py"
      - "agents/firehose.py"
      - "agents/route_news_clusters.py"
      - "agents/judge_stories.py"
      - "api.py"
      - "app.py"
      - "db/schema.py"
      - "scripts/apply_news_rearchitecture_schema.py"
      - "scripts/audit_news_rearchitecture.py"
      - "scripts/eval_story_gold.py"
      - "scripts/export_story_review_packet.py"
      - "scripts/story_quality_weekly.py"
      - "tests/test_news_rearchitecture.py"
      - "db/story_gold/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest tests/test_news_rearchitecture.py
      - run: uv run python scripts/eval_story_gold.py
      - run: uv run python scripts/audit_news_rearchitecture.py --min-gold-files 1
